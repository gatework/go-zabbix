name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: '1.26.x'
            extra: build integration-compile
          - go: '1.27.x'
            extra: build integration-compile integration
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          # Runtime dependencies remain standard-library-only.
          cache: false
      - name: Check shared standard and project contracts
        run: make check CHECK_EXTRA='${{ matrix.extra }}'
